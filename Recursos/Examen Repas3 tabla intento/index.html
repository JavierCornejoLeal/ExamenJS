<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Productos - Tabla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="js/index.js" defer></script>
    <style>
        .text-danger { font-size: 0.9em; margin-top: 5px; }
        table th { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="container my-4">
    <h1 class="text-center mb-4">Gestión de Productos (Tabla)</h1>
    <div class="row">
        <!-- Formulario lateral (CREATE / UPDATE) -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" id="formularioTitulo">Añadir Producto</h5>
                </div>
                <div class="card-body">
                    <form id="formularioProducto" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" id="nombreProducto" class="form-control" required pattern="^[A-Za-z0-9\s]{3,60}$">
                            <div class="invalid-feedback">Entre 3 y 60 caracteres, solo letras, números y espacios.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría *</label>
                            <select id="categoriaProducto" class="form-select" required>
                                <option value="" disabled selected>Selecciona una categoría</option>
                                <option>Portátiles</option><option>Audio</option><option>Móviles</option><option>Accesorios</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio (€) *</label>
                            <input type="text" id="precioProducto" class="form-control" required pattern="^\d+(\.\d{1,2})?$">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock *</label>
                            <input type="number" id="stockProducto" class="form-control" required min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción *</label>
                            <textarea id="descripcionProducto" class="form-control" maxlength="200" rows="2" required></textarea>
                        </div>
                        <p id="mensajeError" class="text-danger"></p>
                        <button type="button" class="btn btn-primary w-100" id="botonEnviar">Añadir Producto</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2" id="botonCancelar" style="display:none;">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla y filtros -->
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-5">
                            <input type="text" id="campoBuscar" class="form-control" placeholder="Buscar por nombre o categoría...">
                        </div>
                        <div class="col-md-4">
                            <select id="filtroCategoriaTabla" class="form-select">
                                <option value="all">Todas las categorías</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button id="ordenPorDefecto" class="btn btn-sm btn-secondary">Defecto</button>
                            <button id="ordenPrecioAsc" class="btn btn-sm btn-secondary">Precio ↑</button>
                            <button id="ordenPrecioDesc" class="btn btn-sm btn-secondary">Precio ↓</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio (€)</th><th>Stock</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <!-- Las filas se generan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


</body>
</html>
